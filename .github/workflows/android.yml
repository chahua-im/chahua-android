name: Build and Sign Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          test -s release.jks || { echo "::error::KEYSTORE_BASE64 is empty or not configured"; exit 1; }

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Align, Sign and Verify APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR/build-tools" ]; then
            echo "::error::Android SDK not found. Please install build-tools or add Android SDK setup step."
            exit 1
          fi

          BUILD_TOOLS=$(ls "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$SDK_DIR/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK_DIR/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::zipalign or apksigner not found under $SDK_DIR/build-tools/$BUILD_TOOLS"
            exit 1
          fi

          mapfile -t APKS < <(find app/build/outputs/apk -type f -name "*release-unsigned.apk" | sort)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No unsigned APKs found at app/build/outputs/apk"
            exit 1
          fi

          mkdir -p artifacts
          for APK in "${APKS[@]}"; do
            DIR=$(dirname "$APK")
            FNAME=$(basename "$APK")
            BASENAME=${FNAME%-unsigned.apk}
            ALIGNED="$DIR/${BASENAME}-aligned.apk"

            echo "Processing $APK -> $ALIGNED"

            "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              "$ALIGNED"

            "$APKSIGNER" verify --verbose "$ALIGNED" || {
              echo "::error::apksigner verification failed for $ALIGNED"
              exit 1
            }

            ABI="universal"
            case "$BASENAME" in
              *arm64*|*arm64-v8a* ) ABI=armv8 ;;
              *armeabi*|*armeabi-v7a* ) ABI=armv7 ;;
              *x86_64* ) ABI=x64 ;;
              *x86* ) ABI=x86 ;;
            esac

            VERSION=$(echo "${{ github.ref_name }}" | tr '/' '-')
            if [ -z "$VERSION" ]; then
              VERSION="manual-${{ github.run_id }}"
            fi

            OUTNAME="chahua-release-${VERSION}-${ABI}.apk"
            cp "$ALIGNED" "artifacts/${OUTNAME}"
          done

          ls -lah artifacts

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: artifacts/*.apk

      - name: Create Release and Upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
