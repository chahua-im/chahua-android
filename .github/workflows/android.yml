name: Build and Sign Release APK

# 触发工作流的事件
on:
  # 1. 当你推送一个以 'v' 开头的标签时触发，例如 v1.0.0
  push:
    tags:
      - 'v*'
  # 2. 允许你从 GitHub 页面手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境 (通常需要 Java 11 或 17)[reference:18]
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle 缓存以加速构建[reference:19]
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 从 Secret 解码并还原 Keystore 文件[reference:20]
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 5. 执行 Release 构建 (会生成未签名的 APK)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. 使用 jarsigner 对 APK 进行签名[reference:21]
      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            app/build/outputs/apk/release/*-release-unsigned.apk \
            ${{ secrets.KEY_ALIAS }}

      # 7. (可选但推荐) 使用 zipalign 对齐 APK，优化运行效率[reference:22]
      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/*-release-unsigned.apk \
            app/build/outputs/apk/release/app-release.apk

      # 8. 将最终的 APK 上传为工作流产物 (Artifact)，方便下载[reference:23]
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release.apk
