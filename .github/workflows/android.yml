name: Build and Sign Release APK

# 触发工作流的事件
on:
  # 1. 当你推送一个以 'v' 开头的标签时触发，例如 v1.0.0
  push:
    tags:
      - 'v*'
  # 2. 允许你从 GitHub 页面手动触发（但手动触发不会自动创建 Release）
  workflow_dispatch:

# ===== 添加以下权限配置 =====
# 赋予该工作流写入仓库内容的权限，以允许创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境 (Android 构建通常需要 Java 11 或 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle 缓存以加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 从 Secret 解码并还原 Keystore 文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 5. 修复 gradlew 执行权限（避免 Permission denied）
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6. 执行 Release 构建 (会生成未签名的 APK)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 7. 使用 jarsigner 对 APK 进行签名
      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            app/build/outputs/apk/release/*-release-unsigned.apk \
            ${{ secrets.KEY_ALIAS }}

      # 8. 使用 zipalign 对齐 APK (优化运行效率)
      - name: Align APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v 4 \
            app/build/outputs/apk/release/*-release-unsigned.apk \
            app/build/outputs/apk/release/app-release.apk

      # 9. 将最终的 APK 上传为工作流产物 (Artifact)
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release.apk

      # 10. 自动创建 GitHub Release 并上传 APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          # 可选的 Release 标题和正文（取消注释即可使用）
          # name: "Release ${{ github.ref_name }}"
          # body: "自动构建的 Release 版本"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
