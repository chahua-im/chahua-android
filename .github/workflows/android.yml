name: Build and Sign Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          test -s release.jks || { echo "::error::KEYSTORE_BASE64 is empty or not configured"; exit 1; }

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Align, Sign and Verify APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          trap 'rm -f release.jks' EXIT

          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR/build-tools" ]; then
            echo "::error::Android SDK not found. Please install build-tools or add Android SDK setup step."
            exit 1
          fi

          BUILD_TOOLS=$(ls "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$SDK_DIR/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK_DIR/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::zipalign or apksigner not found under $SDK_DIR/build-tools/$BUILD_TOOLS"
            exit 1
          fi

          mapfile -t APKS < <(find app/build/outputs/apk -type f -name "*release-unsigned.apk" | sort)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No unsigned APKs found at app/build/outputs/apk"
            exit 1
          fi

          # 版本号：优先 tag；否则用 run_number + 短 SHA，避免出现分支名
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME//\//-}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "Version: ${VERSION}"

          mkdir -p artifacts
          N=0
          for APK in "${APKS[@]}"; do
            DIR=$(dirname "$APK")
            FNAME=$(basename "$APK")
            BASENAME=${FNAME%-unsigned.apk}
            ALIGNED="$DIR/${BASENAME}-aligned.apk"

            echo "Processing $APK -> $ALIGNED"

            "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              "$ALIGNED"

            "$APKSIGNER" verify --verbose "$ALIGNED" || {
              echo "::error::apksigner verification failed for $ALIGNED"
              exit 1
            }

            # 规范化 ABI 名称（使用 Android 官方 ABI 标识）
            ABI="universal"
            case "$BASENAME" in
              *arm64-v8a*|*arm64_v8a*|*arm64* )                ABI="arm64-v8a" ;;
              *armeabi-v7a*|*armeabi_v7a*|*armeabi*|*armv7* )  ABI="armeabi-v7a" ;;
              *x86_64*|*x86-64*|*x64* )                        ABI="x86_64" ;;
              *x86* )                                          ABI="x86" ;;
            esac

            OUTNAME="chahua-release-${VERSION}-${ABI}.apk"
            # 防止 universal（或其他同名）产物互相覆盖
            if [ -e "artifacts/${OUTNAME}" ]; then
              OUTNAME="chahua-release-${VERSION}-${ABI}-${N}.apk"
            fi
            N=$((N + 1))

            cp "$ALIGNED" "artifacts/${OUTNAME}"
          done

          ls -lah artifacts

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-x86
          path: artifacts/*-x86.apk
          if-no-files-found: ignore

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-x86_64
          path: artifacts/*-x86_64.apk
          if-no-files-found: ignore

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-armeabi-v7a
          path: artifacts/*-armeabi-v7a.apk
          if-no-files-found: ignore

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-arm64-v8a
          path: artifacts/*-arm64-v8a.apk
          if-no-files-found: ignore

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-universal
          path: artifacts/*-universal.apk
          if-no-files-found: ignore

      - name: Create Release and Upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f release.jks
